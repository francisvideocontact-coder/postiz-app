name: Image Studio Caillou

# Builds the Studio Caillou image of Postiz (official release + the patches of
# this branch) for the VPS (linux/amd64) and pushes it to GHCR.
on:
  push:
    branches:
      - 'caillou/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=v2.25.1-caillou1 \
            --provenance=false --sbom=false \
            -t ghcr.io/${{ github.repository_owner }}/postiz-app:v2.25.1-caillou1 \
            --push .
